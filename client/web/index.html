  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="VAEAGENT multi-user agent client.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="VAEAGENT">

  <title>VAEAGENT</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    (function () {
      if (!('serviceWorker' in navigator)) return;
      if (sessionStorage.getItem('vaeagent-sw-reset-v2') === 'done') return;
      Promise.all([
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          return Promise.all(registrations.map(function (registration) {
            return registration.unregister();
          }));
        }),
        window.caches ? caches.keys().then(function (keys) {
          return Promise.all(keys.map(function (key) { return caches.delete(key); }));
        }) : Promise.resolve()
      ]).then(function () {
        sessionStorage.setItem('vaeagent-sw-reset-v2', 'done');
        if (navigator.serviceWorker.controller) {
          location.replace('/?fresh=' + Date.now() + location.hash);
        }
      }).catch(function () {
        sessionStorage.setItem('vaeagent-sw-reset-v2', 'done');
      });
    })();
  </script>
  <!--

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js?v=vaeagent-20260707-1" async></script>
</body>
