name: vaeagent_client
description: Cross-platform Flutter client for VAEAGENT.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_markdown: ^0.7.3
  flutter_math_fork: ^0.7.2
  file_picker: ^8.1.2
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: LXGW WenKai
      fonts:
        - asset: assets/fonts/lxgw_wenkai/LXGWWenKai-Light.ttf
          weight: 300
        - asset: assets/fonts/lxgw_wenkai/LXGWWenKai-Regular.ttf
          weight: 400
        - asset: assets/fonts/lxgw_wenkai/LXGWWenKai-Medium.ttf
          weight: 500
    - family: LXGW WenKai Mono
      fonts:
        - asset: assets/fonts/lxgw_wenkai/LXGWWenKaiMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/lxgw_wenkai/LXGWWenKaiMono-Medium.ttf
          weight: 500
